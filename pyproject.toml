[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardine"
dynamic = ["version"]
description = "Cardine workflow CLI development package"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
cardine = "cardine.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/cardine"]
