[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardine"
dynamic = ["version"]
description = "Cardine workflow CLI development package"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
cardine = "cardine.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/cardine"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "cardine/_framework/VERSION"
"capabilities" = "cardine/_framework/capabilities"
"schemas" = "cardine/_framework/schemas"
"migrations" = "cardine/_framework/migrations"
"templates/single" = "cardine/_framework/templates/single"
"skills" = "cardine/_framework/skills"
