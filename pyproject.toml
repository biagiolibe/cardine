[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardine"
dynamic = ["version"]
description = "Cardine development package for the Meridian workflow CLI"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
cardine = "cardine.cli:legacy_main"

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/cardine"]
